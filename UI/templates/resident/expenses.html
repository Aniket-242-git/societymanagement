{% extends "base.html" %}
{% block title %}Expense Transparency{% endblock %}
{% block content %}
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h3 class="fw-bold mb-1"><i class="bi bi-eye me-2"></i>Expense Transparency</h3>
    </div>
    <select id="cat-filter" class="form-select form-select-sm" style="width:auto">
      <option value="">All Categories</option><option value="maintenance">Maintenance</option>
      <option value="security">Security</option><option value="housekeeping">Housekeeping</option>
      <option value="utilities">Utilities</option><option value="repairs">Repairs</option>
      <option value="events">Events</option><option value="salaries">Salaries</option><option value="other">Other</option>
    </select>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-6"><div class="card stat-card"><div class="card-body d-flex align-items-center gap-3">
      <div class="icon-wrap bg-soft-red"><i class="bi bi-graph-down-arrow"></i></div>
      <div><div class="stat-value" id="total-exp">…</div><div class="text-muted small">Total Expenses (shown)</div></div>
    </div></div></div>
    <div class="col-md-6"><div class="card stat-card"><div class="card-body d-flex align-items-center gap-3">
      <div class="icon-wrap bg-soft-blue"><i class="bi bi-tags"></i></div>
      <div><div class="stat-value" id="cat-count">…</div><div class="text-muted small">Categories Active</div></div>
    </div></div></div>
  </div>

  <div class="card panel-card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr><th>Title</th><th>Category</th><th>Amount</th><th>Paid To</th><th>Date</th><th>Receipt</th></tr></thead>
          <tbody id="exp-tbody"><tr><td colspan="6" class="text-center text-muted py-5">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="card-footer bg-white" id="exp-pager"></div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
$(function () {
  const { Api, esc } = SMS; const { INR, formatDate, renderPager } = SMSUI;
  let page = 1;
  function load(p) {
    page = p || 1;
    const params = { page };
    const cat = $("#cat-filter").val(); if (cat) params.category = cat;
    Api.get("expenses/", params).done(function (res) {
      const d = res.data || {};
      const rows = d.results || d || [];
      const total = rows.reduce((s, x) => s + Number(x.amount), 0);
      $("#total-exp").text(INR(total));
      $("#cat-count").text(new Set(rows.map(x => x.category)).size);
      $("#exp-tbody").html(rows.length ? rows.map(x => `
        <tr><td class="fw-semibold">${esc(x.title)}<div class="text-muted small">${esc(x.description || "")}</div></td>
        <td><span class="badge text-bg-light border">${esc(x.category_display)}</span></td>
        <td class="fw-semibold">${INR(x.amount)}</td><td class="small">${esc(x.paid_to || "-")}</td>
        <td class="small">${formatDate(x.expense_date)}</td>
        <td>${x.receipt_image ? `<a href="${x.receipt_image}" target="_blank" class="btn btn-sm btn-outline-secondary"><i class="bi bi-image"></i></a>` : "-"}</td></tr>`).join("")
        : '<tr><td colspan="6" class="text-center text-muted py-5">No expenses recorded</td></tr>');
      renderPager("#exp-pager", d.count || rows.length, page, 20, load);
    });
  }
  $("#cat-filter").on("change", () => load(1));
  load(1);
});
</script>
{% endblock %}
